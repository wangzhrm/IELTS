<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Reading Lab · 批改发布</title>
<style>

:root{--bg:#f5f7fa;--panel:#fff;--ink:#16212e;--muted:#6b7a8d;--line:#dfe6ee;--blue:#1769aa;--green:#1b8a5a;--red:#c0392b;--amber:#b8770a;--navy:#12283f}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--blue);text-decoration:none}h1,h2,h3,h4{margin:0 0 10px}p{margin:0 0 10px}hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:12px 20px;background:var(--navy);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.brand{font-size:17px;font-weight:700;letter-spacing:.3px}.topnav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.topnav a{color:#cfe0f0;padding:6px 12px;border-radius:6px;font-size:13px}.topnav a:hover,.topnav a.active{background:rgba(255,255,255,.15);color:#fff}
.wrap{max-width:1360px;margin:0 auto;padding:18px 20px 60px}.view{display:none}.view.active{display:block}
.hero{background:linear-gradient(135deg,#16385c,#1769aa);color:#fff;border-radius:14px;padding:28px 30px;margin-bottom:18px}
.hero h1{font-size:26px;margin-bottom:8px}.hero p{opacity:.9;max-width:780px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(20,40,70,.04)}
.panel h2{font-size:18px}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600}
.btn:hover{border-color:#b9c8d8;background:#f8fafc}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#115b96}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{background:#fff;border-color:#efc9c4;color:var(--red)}
.btn.sm{padding:5px 9px;font-size:12px}.btn:disabled{opacity:.55;cursor:not-allowed}
.field{display:block;margin-bottom:10px}.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:inherit;background:#fff;color:var(--ink)}
.textarea{resize:vertical;min-height:70px}.input:focus,.select:focus,.textarea:focus{outline:2px solid #bcd8f2;border-color:var(--blue)}
.grid{display:grid;gap:10px}.cols-2{grid-template-columns:repeat(2,1fr)}.cols-3{grid-template-columns:repeat(3,1fr)}.cols-4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.small{font-size:12px}.muted{color:var(--muted)}
.notice{padding:10px 12px;border-radius:7px;background:#eef5fb;border:1px solid #d5e7f7;margin:10px 0;font-size:13px}
.notice.error{background:#fdf0ee;border-color:#f3cfc9;color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.chip{border:1px solid var(--line);background:#fff;padding:5px 10px;border-radius:14px;cursor:pointer;font-size:12px;color:var(--muted)}
.chip.active{background:var(--blue);border-color:var(--blue);color:#fff}.chip.has-content::after{content:" •";color:var(--green)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 13px;cursor:pointer;border:0;background:none;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}.tab-view{display:none}.tab-view.active{display:block}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}
.modal-backdrop{position:fixed;inset:0;background:rgba(12,24,40,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.modal-backdrop.show{display:flex}.modal{background:#fff;border-radius:12px;padding:22px;width:min(560px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#17324d;color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.error{background:var(--red)}
.editor-card{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:12px;background:#fcfdff}
.editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.image-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.image-strip figure{margin:0;text-align:center;font-size:11px;color:var(--muted)}
.image-strip img{height:70px;max-width:140px;object-fit:contain;border:1px solid var(--line);border-radius:5px;cursor:pointer}
.preview-box{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:14px;background:#fff}
.progress{height:7px;background:#e8eef5;border-radius:4px;overflow:hidden;margin-top:8px}.progress>div{height:100%;background:var(--blue);width:0;transition:width .2s}
.attempt-list{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.attempt-item{border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer}.attempt-item:hover{background:#f6f9fc}.attempt-item.active{border-color:var(--blue);background:#eef5fb}
.grade-q{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.option-mark{padding:4px 8px;border-radius:5px;margin:3px 0;font-size:13px}
.student-mark{background:#e7f1fb;border-left:3px solid var(--blue)}.correct-mark{background:#e8f6ef;border-left:3px solid var(--green)}
.answer-line{padding:5px 8px;border-radius:5px;margin:5px 0}.decision{display:block;margin-top:8px;font-size:12px}
.result-card{margin-bottom:12px}.result-card .right{color:var(--green)}.result-card .wrong{color:var(--red)}
/* exam */
.exam-shell{display:none;grid-template-columns:minmax(360px,1fr) minmax(360px,1fr);gap:0;height:calc(100vh - 58px);background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.exam-shell.active{display:grid}
.exam-main{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.exam-side{display:flex;flex-direction:column;min-width:0;background:#fbfcfe}
.exam-head{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fff}
.exam-head h2{font-size:15px;margin:0}.timer{margin-left:auto;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy)}
.timer.danger{color:var(--red)}
.passage-tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);background:#f8fafc}
.passage-tab{border:0;background:none;padding:6px 11px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--muted)}
.passage-tab.active{background:var(--blue);color:#fff}.passage-content{flex:1;overflow:auto;padding:18px 22px;font-size:15px;line-height:1.85}
.passage-content img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;margin:10px 0}
.question-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.question-scroll{flex:1;overflow:auto;padding:18px 20px}.question-card{max-width:640px}
.option-list{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.option{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;cursor:pointer;background:#fff}
.option:hover{background:#f6f9fc}.option input{margin-top:3px}.option .letter{font-weight:700;color:var(--blue);min-width:16px}
.three-options{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.three-options .option{min-width:110px}
.answer-input{width:100%;max-width:420px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font:inherit;margin-top:10px}
.question-context{padding:9px 11px;background:#f3f7fb;border-radius:7px;margin:8px 0;color:var(--muted);font-size:13px}
.word-limit{color:var(--amber);font-weight:600;font-size:12px;margin-top:8px}
.question-nav{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px;border-top:1px solid var(--line);max-height:110px;overflow:auto;background:#fff}
.q-num{width:31px;height:31px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:12px}
.q-num.answered{background:#e7f1fb;border-color:#9dc4e5}.q-num.current{background:var(--blue);color:#fff;border-color:var(--blue)}
.q-num.flagged{box-shadow:0 0 0 2px var(--amber)}
.exam-footer{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);background:#fff}
.review-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0}
.review-item{border:1px solid var(--line);border-radius:7px;padding:8px;cursor:pointer;text-align:left;background:#fff}
.review-item.answered{background:#e7f1fb}.review-item.flagged{outline:2px solid var(--amber)}
@media(max-width:900px){.exam-shell{grid-template-columns:1fr;height:auto}.exam-main,.exam-side{min-height:420px}.cols-4{grid-template-columns:1fr 1fr}.cols-3{grid-template-columns:1fr 1fr}}

</style>
</head>
<body>
<div class="topbar">
  <div class="brand">IELTS Reading Lab <span class="small" style="opacity:.7">CloudBase</span></div>
  <nav class="topnav"><a href="./reading%20teacher.html" data-nav="teacher" class="">老师端</a><a href="./reading%20test.html" data-nav="select" class="">选择测试</a><a href="./reading%20viewer.html" data-nav="grade" class="active">批改发布</a></nav>
</div>
<div class="wrap">
<section class="view" id="view-grade">
  <div id="gradeGate" class="notice">正在验证老师身份…</div>
  <div id="gradeBody" style="display:none">
    <div class="grid cols-2" style="grid-template-columns:330px 1fr;align-items:start">
      <div class="panel"><h2>已提交答卷</h2><div class="attempt-list" id="attemptList"></div></div>
      <div>
        <div class="panel" style="margin-bottom:12px"><div id="summaryPanel"></div>
          <div class="row"><button class="btn primary" id="aiGradeBtn">AI 比对答案</button><button class="btn" id="saveGradeBtn">保存批改</button><button class="btn green" id="publishBtn">保存并发布</button></div></div>
        <div class="panel" style="margin-bottom:12px" id="articlePanel"><h2>文章</h2><div id="gradeArticle"></div></div>
        <div class="panel" id="questionsPanel"><h2>逐题批改</h2><div id="gradeQuestions"></div></div>
      </div>
    </div>
  </div>
</section>
</div>
<div class="toast" id="globalToast"></div>
<div class="modal-backdrop" id="modal"></div>
<script>

'use strict';
/* ========================= 基础工具 ========================= */
const API_URL = new URLSearchParams(location.search).get('api') || localStorage.getItem('ielts_api') || '/ielts-api';
if (new URLSearchParams(location.search).get('api')) localStorage.setItem('ielts_api', API_URL);

async function api(action, payload = {}) {
  const body = Object.assign({}, payload);
  const studentToken = localStorage.getItem('ielts_student_token');
  if (studentToken && !body.token) body.token = studentToken;
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ action }, body)) });
  } catch (e) { throw new Error('无法连接云函数，请检查 API 地址：' + e.message); }
  const text = await res.text();
  let json; try { json = JSON.parse(text); } catch (_) { throw new Error('云函数返回格式错误：' + text.slice(0, 160)); }
  if (!res.ok || json.ok === false) throw new Error(json.error || `请求失败 (${res.status})`);
  return json.data;
}
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const answerText = v => Array.isArray(v) ? v.join(', ') : String(v ?? '');
function fmtTime(ms) { const t = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60; return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function fmtDate(v) { if (!v) return '—'; const d = new Date(v); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function toast(msg, error = false) { const el = document.getElementById('globalToast'); el.textContent = msg; el.classList.toggle('error', error); el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 3200); }
function showModal(html) { const m = document.getElementById('modal'); m.innerHTML = '<div class="modal">' + html + '</div>'; m.classList.add('show'); return m; }
function hideModal() { document.getElementById('modal').classList.remove('show'); }
function band(score, total) { if (!total) return 0; const scaled = Math.round(score / total * 40); return [[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5],[2,2],[1,1],[0,0]].find(([min]) => scaled >= min)[1]; }
function sanitizeHtml(html) {
  const allowed = new Set(['P','H1','H2','H3','H4','H5','H6','STRONG','B','EM','I','U','UL','OL','LI','TABLE','THEAD','TBODY','TR','TH','TD','BR','HR','DIV','SPAN','IMG','SUP','SUB']);
  const doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
  const clean = node => { [...node.children].forEach(child => {
    if (!allowed.has(child.tagName)) { child.replaceWith(...child.childNodes); return; }
    [...child.attributes].forEach(a => { const n = a.name.toLowerCase(); const ok = (n === 'src' && child.tagName === 'IMG' && a.value.startsWith('data:image/')) || ['class','colspan','rowspan'].includes(n); if (!ok) child.removeAttribute(a.name); });
    clean(child);
  }); };
  clean(doc.body); return doc.body.innerHTML;
}
function renderPassage(html, images = []) { return sanitizeHtml(html).replace(/\[\[IMAGE:(\d+)\]\]/g, (_, n) => { const img = images[Number(n)-1]; return img ? `<img src="${esc(img.dataUrl)}" alt="Passage image ${n}">` : ''; }); }
function parseOption(o) { const m = String(o).match(/^([A-Z])[\.\s:：\-–]+(.+)$/); return m ? { letter: m[1], text: m[2] } : { letter: '', text: String(o) }; }
function asArray(v) { if (Array.isArray(v)) return v.map(String); if (v === undefined || v === null || v === '') return []; return [String(v)]; }

/* ========================= 路由 ========================= */
function route() {
  const hash = location.hash || '#home';
  const name = hash.replace(/^#/, '').split('&')[0];
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.topnav a').forEach(a => a.classList.toggle('active', a.dataset.nav === name));
  const map = { home: 'view-home', teacher: 'view-teacher', select: 'view-select', grade: 'view-grade', exam: 'view-exam' };
  const el = document.getElementById(map[name] || 'view-home');
  el.classList.add('active');
  if (name === 'teacher') teacherInit();
  if (name === 'select') selectInit();
  if (name === 'grade') gradeInit();
  if (name === 'exam') examInit();
}
window.addEventListener('hashchange', route);

/* ========================= 管理员登录 ========================= */
function requireAdmin(cb) {
  if (localStorage.getItem('ielts_admin') === '1') { cb(); return; }
  const m = showModal(`<h2>老师端登录</h2>
    <label class="field"><span>管理员用户名</span><input class="input" id="adminUser" placeholder="请输入管理员用户名" autocomplete="username"></label>
    <label class="field"><span>管理员密码</span><input class="input" id="adminPwd" type="password" placeholder="请输入管理员密码" autocomplete="current-password"></label>
    <div id="adminErr" class="notice error" style="display:none"></div>
    <div class="modal-actions"><button class="btn" id="cancelAdmin">取消</button><button class="btn primary" id="okAdmin">登录</button></div>`);
  const submit = async () => {
    try {
      const r = await api('admin.login', { username: m.querySelector('#adminUser').value, password: m.querySelector('#adminPwd').value });
      if (!r.ok) throw new Error('账号或密码错误');
      localStorage.setItem('ielts_admin', '1'); hideModal(); cb();
    } catch (e) { const err = m.querySelector('#adminErr'); err.textContent = e.message; err.style.display = 'block'; }
  };
  m.querySelector('#okAdmin').onclick = submit;
  m.querySelector('#adminUser').onkeydown = e => { if (e.key === 'Enter') submit(); };
  m.querySelector('#adminPwd').onkeydown = e => { if (e.key === 'Enter') submit(); };
  m.querySelector('#cancelAdmin').onclick = () => { hideModal(); };
}

/* ========================= 首页 ========================= */
async function ping() {
  const el = document.getElementById('pingState');
  if (!el) return;
  try { const r = await api('ping'); el.innerHTML = `云函数正常 · 模型 <b>${esc(r.model)}</b> · AI Key ${r.keySet ? '已配置' : '未配置'}`; }
  catch (e) { el.textContent = '云函数检测失败：' + e.message; }
}
if (document.getElementById('pingBtn')) document.getElementById('pingBtn').onclick = ping;

/* ========================= 老师端 ========================= */
const TYPE_LABELS = { mcq:'单项选择题', multiple:'多项选择题', tfng:'True / False / Not Given', ynng:'Yes / No / Not Given', matching:'匹配题', completion:'摘要 / 笔记填空', 'short-answer':'简答题', diagram:'图表 / 流程图填空' };
const T = { volumes: [], volumeId: '1', testId: null, content: null, answers: {}, images: [], pages: [], lastTextarea: null, inited: false };
function emptyContent() { return { title:'IELTS Academic Reading Test', instructions:'You should spend about 20 minutes on each passage.', timeLimitMinutes:60, passages:[{id:'p1',title:'Reading Passage 1',html:''}], sections:[], questions:[], images:[] }; }
function normalizeContent(c) {
  c = c || emptyContent(); c.timeLimitMinutes = 60; c.passages ||= []; c.questions ||= []; c.sections ||= []; c.images ||= [];
  c.questions.forEach((q,i) => { q.id ||= `q${i+1}`; q.number = Number(q.number) || i+1; q.type ||= 'completion'; q.prompt ||= ''; q.options = Array.isArray(q.options) ? q.options : []; q.answer = Array.isArray(q.answer) ? q.answer : (q.answer ? [q.answer] : []); q.passageId ||= c.passages[0]?.id || 'p1'; });
  return c;
}
function teacherInit() {
  if (!localStorage.getItem('ielts_admin')) { document.getElementById('teacherGate').textContent = '请先登录老师端。'; requireAdmin(() => { document.getElementById('teacherGate').style.display = 'none'; document.getElementById('teacherBody').style.display = 'block'; teacherLoad(); }); return; }
  document.getElementById('teacherGate').style.display = 'none'; document.getElementById('teacherBody').style.display = 'block';
  if (!T.inited) teacherLoad();
}
async function teacherLoad() {
  try {
    const data = await api('bootstrap'); T.volumes = data.volumes; T.inited = true;
    renderVolumePicker('volumePicker', 'testPicker');
    await selectVolume('1'); await selectTest('1'); await loadStudents(); await ping();
  } catch (e) { document.getElementById('teacherGate').style.display = 'block'; document.getElementById('teacherGate').textContent = '加载失败：' + e.message; }
}
function renderVolumePicker(volHost, testHost, stateRef = T) {
  document.getElementById(volHost).innerHTML = stateRef.volumes.map(v => `<button class="chip ${v.id === stateRef.volumeId ? 'active' : ''}" data-volume="${esc(v.id)}">Vol ${v.number}</button>`).join('');
  renderTestPicker(testHost, stateRef);
}
function renderTestPicker(host, stateRef = T) {
  const vol = stateRef.volumes.find(v => v.id === stateRef.volumeId);
  document.getElementById(host).innerHTML = (vol?.tests || []).map(t => `<button class="chip ${t.id === stateRef.testId ? 'active' : ''} ${t.hasContent ? 'has-content' : ''}" data-test="${esc(t.id)}">Test ${t.number}</button>`).join('');
}
async function selectVolume(id, testHost = 'testPicker', stateRef = T) { stateRef.volumeId = String(id); renderVolumePicker(stateRef === T ? 'volumePicker' : 'selVolumePicker', testHost, stateRef); }
async function selectTest(id, stateRef = T) {
  stateRef.testId = String(id); renderTestPicker(stateRef === T ? 'testPicker' : 'selTestPicker', stateRef);
  const vol = stateRef.volumes.find(v => v.id === stateRef.volumeId); const test = vol?.tests.find(t => t.id === stateRef.testId);
  if (stateRef === T) {
    document.getElementById('curVolume').textContent = vol?.number || ''; document.getElementById('curTest').textContent = test?.number || '';
    document.getElementById('testMeta').textContent = test?.hasContent ? `已保存 · ${test.questionCount} 题` : '空题库';
    const data = await api('test.get', { id: stateRef.testId });
    T.content = normalizeContent(data.content); T.answers = data.answers || {}; T.images = T.content.images || [];
    document.getElementById('paperTitle').value = T.content.title || ''; document.getElementById('paperInstructions').value = T.content.instructions || '';
    renderPassageEditor(); renderQuestionEditor(); renderPreview();
  } else {
    document.getElementById('selMeta').textContent = test?.hasContent ? `Vol ${vol.number} · Test ${test.number} · ${test.questionCount} 题` : `Vol ${vol.number} · Test ${test.number} · 空题库`;
  }
}
function bindTeacher() {
  document.getElementById('volumePicker').onclick = e => { const b = e.target.closest('[data-volume]'); if (b) selectVolume(b.dataset.volume); };
  document.getElementById('testPicker').onclick = e => { const b = e.target.closest('[data-test]'); if (b) selectTest(b.dataset.test); };
  document.querySelectorAll('#view-teacher .tab').forEach(tab => tab.onclick = () => {
    document.querySelectorAll('#view-teacher .tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('#view-teacher .tab-view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active'); document.getElementById('view-' + tab.dataset.tab.trim()).classList.add('active');
  });
  document.getElementById('parseBtn').onclick = parsePdf;
  document.getElementById('generateAnswersBtn').onclick = generateAnswers;
  document.getElementById('saveBtn').onclick = saveTest;
  document.getElementById('addPassageBtn').onclick = () => { T.content.passages.push({ id:'p'+(T.content.passages.length+1), title:'Reading Passage '+(T.content.passages.length+1), html:'' }); renderPassageEditor(); renderQuestionEditor(); renderPreview(); };
  document.getElementById('addQuestionBtn').onclick = () => { const id='q'+Date.now().toString(36); T.content.questions.push({ id, number:T.content.questions.length+1, type:'completion', passageId:T.content.passages[0]?.id||'p1', prompt:'', options:[], answer:[] }); renderQuestionEditor(); renderPreview(); };
  document.getElementById('paperTitle').oninput = e => { T.content.title = e.target.value; };
  document.getElementById('paperInstructions').oninput = e => { T.content.instructions = e.target.value; };
  document.getElementById('addStudentBtn').onclick = () => openStudentModal();
  if (document.getElementById('changeAdminUserBtn')) document.getElementById('changeAdminUserBtn').onclick = openAdminUserModal;
  document.getElementById('changeAdminPwdBtn').onclick = openAdminPwdModal;
  document.getElementById('logoutBtn').onclick = () => { localStorage.removeItem('ielts_admin'); location.reload(); };
}
function renderPassageEditor() {
  const host = document.getElementById('passageEditor');
  host.innerHTML = T.content.passages.map((p,i) => `<div class="editor-card"><div class="editor-head"><strong>Passage ${i+1}</strong><button class="btn sm danger" data-del-passage="${i}">删除</button></div>
    <label class="field"><span>标题</span><input class="input" data-p="${i}" data-field="title" value="${esc(p.title)}"></label>
    <label class="field"><span>文章 HTML（插图处写 [[IMAGE:1]]）</span><textarea class="textarea" data-p="${i}" data-field="html" style="min-height:190px">${esc(p.html)}</textarea></label>
    <div class="small muted">点击图片，在光标处插入标记：</div><div class="image-strip">${T.images.map((img,n)=>`<figure><img data-marker="${n+1}" src="${esc(img.dataUrl)}"><figcaption>IMAGE:${n+1}</figcaption></figure>`).join('') || '<span class="muted small">暂无图片</span>'}</div></div>`).join('');
  host.oninput = e => { const t=e.target; if (t.dataset.p === undefined) return; T.content.passages[Number(t.dataset.p)][t.dataset.field] = t.value; renderPreview(); };
  host.onfocusin = e => { if (e.target.tagName === 'TEXTAREA') T.lastTextarea = e.target; };
  host.onclick = e => {
    const del = e.target.closest('[data-del-passage]'); if (del) { T.content.passages.splice(Number(del.dataset.delPassage),1); renderPassageEditor(); renderQuestionEditor(); renderPreview(); return; }
    const img = e.target.closest('[data-marker]'); if (img) { const marker=`[[IMAGE:${img.dataset.marker}]]`; const ta=T.lastTextarea||host.querySelector('textarea'); if (ta) { const s=ta.selectionStart??ta.value.length; ta.value=ta.value.slice(0,s)+marker+ta.value.slice(s); ta.dispatchEvent(new Event('input',{bubbles:true})); } }
  };
}
const lineToArray = v => String(v||'').split('\n').map(x=>x.trim()).filter(Boolean);
const arrayToText = v => Array.isArray(v) ? v.join('\n') : (v ? String(v) : '');
function renderQuestionEditor() {
  const host = document.getElementById('questionEditor');
  host.innerHTML = T.content.questions.map((q,i) => `<div class="editor-card"><div class="editor-head"><strong>Question ${q.number}</strong><button class="btn sm danger" data-del-q="${i}">删除</button></div>
    <div class="grid cols-4">
      <label class="field"><span>题号</span><input class="input" type="number" data-q="${i}" data-field="number" value="${q.number}"></label>
      <label class="field"><span>题型</span><select class="select" data-q="${i}" data-field="type">${Object.entries(TYPE_LABELS).map(([v,l])=>`<option value="${v}" ${q.type===v?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="field"><span>所属文章</span><select class="select" data-q="${i}" data-field="passageId">${T.content.passages.map(p=>`<option value="${esc(p.id)}" ${q.passageId===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select></label>
      <label class="field"><span>词数限制</span><input class="input" type="number" data-q="${i}" data-field="wordLimit" value="${q.wordLimit||''}"></label>
    </div>
    <label class="field"><span>共享说明 / 表格说明</span><textarea class="textarea" data-q="${i}" data-field="context" style="min-height:55px">${esc(q.context||'')}</textarea></label>
    <label class="field"><span>题干</span><textarea class="textarea" data-q="${i}" data-field="prompt" style="min-height:55px">${esc(q.prompt)}</textarea></label>
    <div class="grid cols-2">
      <label class="field"><span>选项（每行一个）</span><textarea class="textarea" data-q="${i}" data-field="options">${esc(arrayToText(q.options))}</textarea></label>
      <label class="field"><span>正确答案（每行一个；可接受答案用 | 分隔）</span><textarea class="textarea" data-q="${i}" data-field="answer">${esc(arrayToText(q.answer))}</textarea></label>
    </div>
    <label class="field small"><span>多选允许数量</span><input class="input" type="number" data-q="${i}" data-field="maxAnswers" value="${q.maxAnswers||''}"></label></div>`).join('') || '<div class="notice">还没有题目。上传 PDF 识别，或点击「+ 新增题目」。</div>';
  host.oninput = e => { const t=e.target; if (t.dataset.q === undefined) return; const q=T.content.questions[Number(t.dataset.q)], f=t.dataset.field;
    if (f==='options'||f==='answer') { q[f]=lineToArray(t.value); if (f==='answer') T.answers[q.id]=q.answer; }
    else if (['number','wordLimit','maxAnswers'].includes(f)) q[f]=t.value?Number(t.value):null;
    else q[f]=t.value; renderPreview(); };
  host.onclick = e => { const d=e.target.closest('[data-del-q]'); if (d) { T.content.questions.splice(Number(d.dataset.delQ),1); renderQuestionEditor(); renderPreview(); } };
}
function renderPreview() {
  const c=T.content;
  const passages=c.passages.map(p=>`<section><h3>${esc(p.title)}</h3>${renderPassage(p.html,T.images)}</section>`).join('<hr>');
  const qs=c.questions.map(q=>`<div style="margin-bottom:12px"><strong>${q.number}. ${esc(q.prompt)}</strong><div class="small muted">${TYPE_LABELS[q.type]||q.type}</div>${q.context?`<div class="small">${esc(q.context)}</div>`:''}<div class="small">${(q.options||[]).map(o=>`<div>${esc(o)}</div>`).join('')}</div><div class="small" style="color:var(--green)">正确答案：${esc((q.answer||[]).join(' / ')||'未设置')}</div></div>`).join('');
  document.getElementById('contentPreview').innerHTML = (passages||'<p class="muted">暂无文章</p>')+'<hr><h3>Questions</h3>'+(qs||'<p class="muted">暂无题目</p>');
}
function setParseStatus(text, p) { document.getElementById('parseStatus').textContent = text; document.getElementById('parseProgress').style.width = (p||0)+'%'; }
async function parsePdf() {
  const file = document.getElementById('pdfFile').files[0]; if (!file) return toast('请先选择 PDF 文件', true);
  try {
    setParseStatus('正在加载 PDF 解析组件…', 5);
    const pdfjs = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs';
    const bytes = new Uint8Array(await file.arrayBuffer()); const pdf = await pdfjs.getDocument({ data: bytes }).promise;
    const pages = [], images = [];
    for (let no=1; no<=pdf.numPages; no++) {
      const page = await pdf.getPage(no); const tc = await page.getTextContent(); const lines = new Map();
      for (const item of tc.items) { if (!item.str?.trim()) continue; const y=Math.round(item.transform[5]/4)*4; if (!lines.has(y)) lines.set(y,[]); lines.get(y).push({x:item.transform[4],t:item.str}); }
      const sorted = [...lines.entries()].sort((a,b)=>b[0]-a[0]).map(([y,items])=>({y,text:items.sort((a,b)=>a.x-b.x).map(i=>i.t).join(' ')}));
      const vp = page.getViewport({ scale: 1.6 }); const canvas=document.createElement('canvas'); canvas.width=Math.floor(vp.width); canvas.height=Math.floor(vp.height);
      const ctx=canvas.getContext('2d',{willReadFrequently:true}); await page.render({canvasContext:ctx,viewport:vp}).promise;
      const ops = await page.getOperatorList();
      for (let i=0;i<ops.fnArray.length && images.length<16;i++) {
        const fn=ops.fnArray[i]; if (![pdfjs.OPS.paintImageXObject,pdfjs.OPS.paintJpegXObject,pdfjs.OPS.paintInlineImageXObject].includes(fn)) continue;
        const args=ops.argsArray[i]; const m=Array.isArray(args?.[1])?args[1]:null; if (!m||m.length<6) continue;
        const rect=transformToRect(m,page,1.6,canvas.width,canvas.height); if (rect.w<18||rect.h<18) continue;
        const crop=document.createElement('canvas'); crop.width=Math.min(800,Math.max(1,Math.round(rect.w))); crop.height=Math.min(800,Math.max(1,Math.round(rect.h)));
        crop.getContext('2d').drawImage(canvas,rect.x,rect.y,rect.w,rect.h,0,0,crop.width,crop.height);
        const near=sorted.reduce((best,l)=>{const d=Math.abs(l.y-((rect.y+rect.h/2)/1.6+(page.view?.[1]||0)));return !best||d<best.d?{d,text:l.text}:best;},null);
        images.push({index:images.length+1,page:no,dataUrl:crop.toDataURL('image/jpeg',0.8),nearText:near?.text||''});
      }
      pages.push({page:no,text:sorted.map(l=>l.text).join('\n'),image:canvas.toDataURL('image/jpeg',0.65),images:images.filter(x=>x.page===no)});
      setParseStatus(`已解析第 ${no}/${pdf.numPages} 页`, 8+Math.round(no/pdf.numPages*42));
    }
    T.pages=pages; T.images=images; setParseStatus('正在调用 AI 识别文章与题目…',55);
    let content; try { const r=await api('ai.parsePdf',{pages}); content=r.content; toast('AI 识别完成'); }
    catch(e) { content=fallbackParse(pages,images); toast('AI 识别失败，已使用简化解析：'+e.message,true); }
    T.content=normalizeContent(content); T.content.images=T.images; insertImageMarkers(T.content,T.images);
    T.answers=Object.fromEntries(T.content.questions.map(q=>[q.id,q.answer||[]]));
    document.getElementById('paperTitle').value=T.content.title||''; document.getElementById('paperInstructions').value=T.content.instructions||'';
    renderPassageEditor(); renderQuestionEditor(); renderPreview();
    setParseStatus(`解析完成：${T.content.passages.length} 篇文章，${T.content.questions.length} 道题，${T.images.length} 张图片。请核实后保存。`,100);
  } catch(e) { setParseStatus('解析失败：'+e.message,0); toast(e.message,true); }
}
function transformToRect(m,page,scale,cw,ch) { const [a,b,c,d,e,f]=m; const pts=[[0,0],[1,0],[1,1],[0,1]].map(([u,v])=>[a*u+c*v+e,b*u+d*v+f]); const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]); const x1=Math.min(...xs),x2=Math.max(...xs),y1=Math.min(...ys),y2=Math.max(...ys); const vx=page.view?.[0]||0, vy=page.view?.[3]||(ch/scale); const left=(x1-vx)*scale,right=(x2-vx)*scale,top=(vy-y2)*scale,bottom=(vy-y1)*scale; const x=Math.max(0,Math.min(cw-1,Math.round(left))),y=Math.max(0,Math.min(ch-1,Math.round(top))); return {x,y,w:Math.min(cw-x,Math.round(right-left)),h:Math.min(ch-y,Math.round(bottom-top))}; }
function fallbackParse(pages,images) { const text=pages.map(p=>p.text).join('\n'); const idx=text.search(/Questions\s+1\b/i); const article=idx>=0?text.slice(0,idx):text.slice(0,Math.floor(text.length*.65)); const qtext=idx>=0?text.slice(idx):text.slice(Math.floor(text.length*.65)); const paras=article.split(/\n{2,}|\n(?=[A-Z])/).map(x=>x.trim()).filter(Boolean).slice(0,12); const qLines=qtext.split('\n').map(x=>x.trim()).filter(x=>/^\d+[\.\)]?\s+/.test(x)).slice(0,40); return { title:'IELTS Academic Reading Test',instructions:'Answer all questions.',passages:[{id:'p1',title:'Reading Passage 1',html:paras.map(p=>`<p>${esc(p)}</p>`).join('\n')}],sections:[],questions:qLines.map((l,i)=>({id:'q'+(i+1),number:i+1,type:'completion',passageId:'p1',prompt:l.replace(/^\d+[\.\)]?\s+/,''),options:[],answer:[]})),images }; }
function insertImageMarkers(c,imgs) { imgs.forEach((img,i)=>{ const marker=`[[IMAGE:${i+1}]]`; const needle=String(img.nearText||'').trim().slice(0,80); let placed=false; for (const p of c.passages) { if (needle&&p.html.includes(needle)) { p.html=p.html.replace(needle,needle+' '+marker); placed=true; break; } } if (!placed&&c.passages[0]) c.passages[0].html+=`\n<p>${marker}</p>`; }); }
async function generateAnswers() { try { setParseStatus('正在调用 AI 生成答案…',70); const r=await api('ai.generateAnswers',{id:T.testId}); T.answers=r.answers; T.content.questions.forEach(q=>{q.answer=r.answers[q.id]||q.answer||[];}); renderQuestionEditor(); renderPreview(); toast('答案已生成，请逐题核实后保存'); setParseStatus('AI 答案已生成，请核实并点击保存。',100); } catch(e){ toast(e.message,true); } }
async function saveTest() { try { T.content.images=T.images; const answers=Object.fromEntries(T.content.questions.map(q=>[q.id,q.answer||[]])); await api('test.save',{id:T.testId,content:T.content,answers}); const d=await api('bootstrap'); T.volumes=d.volumes; renderTestPicker('testPicker'); toast('已保存到当前 Test'); } catch(e){ toast(e.message,true); } }
async function loadStudents() {
  try { const d=await api('students.list'); document.getElementById('studentTable').innerHTML=d.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.username)}</td><td class="small muted">${fmtDate(s.created_at)}</td><td><button class="btn sm" data-edit="${esc(s.id)}">修改</button> <button class="btn sm danger" data-del="${esc(s.id)}">删除</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">暂无学生</td></tr>';

  } catch(e){ toast(e.message,true); }
}
function openStudentModal(s=null) { const m=showModal(`<h2>${s?'修改':'新建'}学生账号</h2><label class="field"><span>姓名</span><input class="input" id="stuName" value="${esc(s?.name||'')}"></label><label class="field"><span>账号</span><input class="input" id="stuUser" value="${esc(s?.username||'')}"></label><label class="field"><span>${s?'新密码（留空不修改）':'密码'}</span><input class="input" id="stuPwd" type="password"></label><div class="modal-actions"><button class="btn" id="cancelStu">取消</button><button class="btn primary" id="okStu">保存</button></div>`);

async function deleteStudent(id) { if(!confirm('确定删除这个学生账号吗？')) return; try { await api('students.delete',{id}); await loadStudents(); toast('已删除'); } catch(e){ toast(e.message,true); } }
function openAdminUserModal() { const m=showModal(`<h2>修改管理员用户名</h2><label class="field"><span>新用户名</span><input class="input" id="newUser"></label><div class="modal-actions"><button class="btn" id="cancelUser">取消</button><button class="btn primary" id="okUser">保存</button></div>`); m.querySelector('#cancelUser').onclick=hideModal; m.querySelector('#okUser').onclick=async()=>{ const v=m.querySelector('#newUser').value.trim(); if(!v) return toast('用户名不能为空',true); try { await api('admin.username',{username:v}); hideModal(); toast('管理员用户名已修改'); } catch(e){ toast(e.message,true); } }; }
function openAdminPwdModal() { const m=showModal(`<h2>修改管理员密码</h2><label class="field"><span>新密码</span><input class="input" id="newPwd" type="password"></label><div class="modal-actions"><button class="btn" id="cancelPwd">取消</button><button class="btn primary" id="okPwd">保存</button></div>`); m.querySelector('#cancelPwd').onclick=hideModal; m.querySelector('#okPwd').onclick=async()=>{ const v=m.querySelector('#newPwd').value; if(v.length<4) return toast('密码至少 4 位',true); try { await api('admin.password',{newPassword:v}); hideModal(); toast('管理员密码已修改'); } catch(e){ toast(e.message,true); } }; }

const S = { volumes: [], volumeId: '1', testId: null, inited: false };
async function selectInit() { if (S.inited) return; try { const d=await api('bootstrap'); S.volumes=d.volumes; S.inited=true; renderVolumePicker('selVolumePicker','selTestPicker',S); await selectVolume('1','selTestPicker',S); bindSelect(); } catch(e){ toast(e.message,true); } }
function bindSelect() {
  document.getElementById('selVolumePicker').onclick=e=>{ const b=e.target.closest('[data-volume]'); if(b) selectVolume(b.dataset.volume,'selTestPicker',S); };
  document.getElementById('selTestPicker').onclick=e=>{ const b=e.target.closest('[data-test]'); if(b) selectTest(b.dataset.test,S); };

async function queryHistory() { const name=document.getElementById('histName').value.trim(); if(!name) return; try { const d=await api('student.history',{name}); document.getElementById('histList').innerHTML=d.history.map(h=>`<div class="panel" style="margin-bottom:8px"><strong>Vol ${h.volume} · Test ${h.test}</strong> <span class="small muted">${fmtDate(h.submittedAt)}</span><div class="small">答对 ${h.score??'—'} · Band ${h.band!=null?Number(h.band).toFixed(1):'—'} ${h.published?'<span class="chip" style="color:var(--green)">已发布</span>':'<span class="chip">待批改</span>'}</div></div>`).join('')||'<div class="notice">该姓名暂无考试记录。</div>'; } catch(e){ toast(e.message,true); } }

const G = { attempts: [], currentId: null, detail: null, decisions: {}, inited: false };
function gradeInit() { if(!localStorage.getItem('ielts_admin')) { document.getElementById('gradeGate').textContent='请先登录老师端。'; requireAdmin(()=>{ document.getElementById('gradeGate').style.display='none'; document.getElementById('gradeBody').style.display='block'; gradeLoad(); }); return; } document.getElementById('gradeGate').style.display='none'; document.getElementById('gradeBody').style.display='block'; if(!G.inited) gradeLoad(); }
async function gradeLoad() { try { await loadAttempts(); bindGrade(); G.inited=true; } catch(e){ document.getElementById('gradeGate').style.display='block'; document.getElementById('gradeGate').textContent='加载失败：'+e.message; } }
async function loadAttempts() { const d=await api('grading.attempts'); G.attempts=d.attempts; document.getElementById('attemptList').innerHTML=d.attempts.map(a=>`<div class="attempt-item ${a.id===G.currentId?'active':''}" data-attempt="${esc(a.id)}"><strong>${esc(a.studentName)}</strong><div class="small muted">V${a.volume} · T${a.test} · ${fmtDate(a.submittedAt)}</div><div class="small">${a.score!=null?`答对 ${a.score}/${a.total||'?'} · ${Number(a.band).toFixed(1)}`:'待批改'} ${a.published?'<span class="chip" style="color:var(--green)">已发布</span>':''}</div></div>`).join('')||'<div class="notice">暂无已提交答卷。</div>'; document.getElementById('attemptList').onclick=e=>{ const it=e.target.closest('[data-attempt]'); if(it) selectAttempt(it.dataset.attempt); }; if(d.attempts.length&&!G.currentId) await selectAttempt(d.attempts[0].id); }
async function selectAttempt(id) { G.currentId=id; const d=await api('grading.detail',{id}); G.detail=d; G.decisions={}; (d.content?.questions||[]).forEach(q=>{ const r=(d.attempt.report||[]).find(x=>x.questionId===q.id); G.decisions[q.id]=r?!!r.correct:false; }); await loadAttempts(); renderGradeSummary(); renderGradeArticle(); renderGradeQuestions(); }
function renderGradeSummary() { const a=G.detail.attempt, c=G.detail.content||{}; const n=Object.values(G.decisions).filter(Boolean).length, total=c.questions?.length||0; document.getElementById('summaryPanel').innerHTML=`<div class="panel-title"><h2>${esc(a.studentName)} · Volume ${a.volume} · Test ${a.test}</h2><span class="muted small">${fmtDate(a.submittedAt)}</span></div><div class="notice">当前判定：答对 <strong>${n}</strong> / ${total} 题 · 折算 40 题约 <strong>${total?Math.round(n/total*40):0}</strong> 题 · 雅思阅读分数 <strong>${total?band(n,total).toFixed(1):'—'}</strong> ${a.published?'· <strong style="color:var(--green)">已发布</strong>':''}</div>`; }
function renderGradeArticle() { const ps=G.detail.content?.passages||[]; document.getElementById('gradeArticle').innerHTML=ps.map(p=>`<section><h3>${esc(p.title)}</h3>${renderPassage(p.html,G.detail.content?.images||[])}</section>`).join('<hr>'); }
function renderGradeQuestions() { const c=G.detail.content||{}, answers=G.detail.attempt.answers||{}, report=G.detail.attempt.report||[]; document.getElementById('gradeQuestions').innerHTML=(c.questions||[]).map(q=>{ const st=asArray(answers[q.id]), co=asArray(q.answer), ok=!!G.decisions[q.id], by=report.find(r=>r.questionId===q.id)?.decidedBy||'auto'; const opts=(q.options||[]).map(o=>{ const op=parseOption(o), key=op.letter||op.text, s=st.includes(key), cr=co.includes(key); return `<div class="option-mark ${s?'student-mark':''} ${cr?'correct-mark':''}">${op.letter?`<strong>${esc(op.letter)}.</strong> `:''}${esc(op.text)}${s?' <span class="small">（学生答案）</span>':''}${cr?' <span class="small">（正确答案）</span>':''}</div>`; }).join(''); return `<div class="grade-q"><div style="display:flex;justify-content:space-between;gap:10px"><strong>Q${q.number}. ${esc(q.prompt)}</strong><span class="chip" style="color:${ok?'var(--green)':'var(--red)'}">${ok?'正确':'错误'}</span></div>${q.context?`<div class="small muted">${esc(q.context)}</div>`:''}<div class="answer-line student-mark">学生答案：<strong>${esc(st.join(', ')||'未作答')}</strong></div><div class="answer-line correct-mark">正确答案：<strong>${esc(co.join(', ')||'未设置')}</strong></div>${opts}<label class="decision"><input type="checkbox" data-decision="${esc(q.id)}" ${ok?'checked':''}> 判为正确 <span class="small muted">（${by==='ai'?'AI 初判':'系统/人工初判'}，可人工覆盖）</span></label></div>`; }).join('')||'<div class="notice">该题库没有题目。</div>'; document.getElementById('gradeQuestions').onchange=e=>{ const i=e.target.closest('[data-decision]'); if(i){ G.decisions[i.dataset.decision]=i.checked; renderGradeSummary(); } }; }
function bindGrade() { document.getElementById('aiGradeBtn').onclick=async()=>{ try { toast('正在调用 AI 比对…'); const r=await api('ai.grade',{testId:G.detail.attempt.testId,answers:G.detail.attempt.answers}); r.results.forEach(x=>{G.decisions[x.questionId]=!!x.correct;}); renderGradeQuestions(); renderGradeSummary(); toast('AI 比对完成，请人工核实'); } catch(e){ toast(e.message,true); } };
  document.getElementById('saveGradeBtn').onclick=()=>saveGrade(false); document.getElementById('publishBtn').onclick=()=>saveGrade(true); }
async function saveGrade(publish) { try { const c=G.detail.content||{}, answers=G.detail.attempt.answers||{}; const report=(c.questions||[]).map(q=>({questionId:q.id,studentAnswer:answers[q.id]??'',correctAnswer:q.answer||[],correct:!!G.decisions[q.id],decidedBy:'teacher'})); const r=await api('grading.save',{id:G.currentId,report,publish}); toast(publish?'成绩已保存并发布，学生可查看':'批改结果已保存'); G.detail.attempt.published=r.published; const keep=G.currentId; await loadAttempts(); if(keep) await selectAttempt(keep); } catch(e){ toast(e.message,true); } }

/* ========================= 学生答题 ========================= */
const E = { testId:null, content:null, token:'', answers:{}, flags:{}, current:0, currentPassage:'p1', deadlineAt:null, attemptId:null, submitted:false, timer:null, saveTimer:null, inited:false };
function examParams() { const p=new URLSearchParams((location.hash.split('&').slice(1).join('&'))); return { volume:Number(p.get('volume')||p.get('v')||1), test:Number(p.get('test')||p.get('t')||1) }; }
async function examInit() { if(E.inited) return; E.inited=true; bindExam(); try { const d=await api('bootstrap'); const { volume:vno,t:tno }=examParams(); const vol=d.volumes.find(v=>v.number===vno), test=vol?.tests.find(t=>t.number===tno); if(!test) throw new Error(`找不到 Volume ${vno} Test ${tno}`); E.testId=test.id; const td=await api('test.get',{id:test.id}); E.content=td.content; if(!E.content) throw new Error('该 Test 尚未上传题库内容'); document.getElementById('examTitle').textContent=E.content.title||`Reading Test ${vno}.${tno}`; document.getElementById('examTitle2').textContent=E.content.title||`Reading Test ${vno}.${tno}`; document.getElementById('examMeta').textContent=`Volume ${vno} · Test ${tno} · ${E.content.questions?.length||0} 题`; E.currentPassage=E.content.passages[0]?.id||'p1'; E.flags=JSON.parse(localStorage.getItem('ielts_flags_'+E.testId)||'{}'); E.token=localStorage.getItem('ielts_student_token')||''; if(E.token && localStorage.getItem('ielts_student_testid')!==String(E.testId)) { E.token=''; localStorage.removeItem('ielts_student_token'); } if(E.token) { try { const me=await api('exam.me'); if(me.attempt) { E.answers=me.attempt.answers||{}; E.submitted=me.attempt.status==='submitted'; E.deadlineAt=me.attempt.deadlineAt; E.attemptId=me.attempt.id; if(E.submitted) showSubmitted(true); else enterExam(); } } catch(_) { E.token=''; } } } catch(e) { const err=document.getElementById('loginError'); err.textContent=e.message; err.style.display='block'; } }
function bindExam() {
  document.getElementById('startBtn').onclick=startExam; document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')startExam();};
  document.getElementById('resultBtn').onclick=openResultModal; document.getElementById('prevBtn').onclick=()=>goTo(E.current-1); document.getElementById('nextBtn').onclick=()=>goTo(E.current+1);
  document.getElementById('flagBtn').onclick=toggleFlag; document.getElementById('reviewBtn').onclick=openReview; document.getElementById('submitBtn').onclick=confirmSubmit;
}
async function startExam() { try { const l=await api('exam.login',{testId:E.testId,username:document.getElementById('username').value.trim(),password:document.getElementById('password').value}); E.token=l.token; localStorage.setItem('ielts_student_token',l.token); localStorage.setItem('ielts_student_testid',String(E.testId)); const st=await api('exam.start'); E.attemptId=st.attemptId; E.deadlineAt=st.deadlineAt; const me=await api('exam.me'); E.answers=me.attempt?.answers||{}; enterExam(); } catch(e){ const err=document.getElementById('loginError'); err.textContent=e.message; err.style.display='block'; } }
function enterExam() { document.getElementById('examLoginWrap').style.display='none'; document.getElementById('examShell').classList.add('active'); renderPassages(); renderQuestion(); clearInterval(E.timer); E.timer=setInterval(tick,500); tick(); }
function renderPassages() { const ps=E.content.passages||[]; document.getElementById('passageTabs').innerHTML=ps.map(p=>`<button class="passage-tab ${p.id===E.currentPassage?'active':''}" data-passage="${esc(p.id)}">${esc(p.title||'Passage')}</button>`).join(''); const p=ps.find(x=>x.id===E.currentPassage)||ps[0]; document.getElementById('passageContent').innerHTML=p?`<h3>${esc(p.title||'Reading Passage')}</h3>${renderPassage(p.html,E.content.images||[])}`:'<p class="muted">暂无文章</p>'; document.getElementById('passageTabs').onclick=e=>{ const b=e.target.closest('[data-passage]'); if(b){E.currentPassage=b.dataset.passage;renderPassages();} }; }
function renderQuestion() { const qs=E.content.questions||[]; if(!qs.length) return; E.current=Math.max(0,Math.min(E.current,qs.length-1)); const q=qs[E.current]; if(q.passageId) E.currentPassage=q.passageId; renderPassages(); const sec=(E.content.sections||[]).find(s=>(s.questionIds||[]).includes(q.id)); document.getElementById('questionPosition').textContent=`Question ${q.number} of ${qs.length}`; document.getElementById('questionScroll').innerHTML=`<div class="question-card">${sec?.instruction?`<p class="muted small">${esc(sec.instruction)}</p>`:''}<h3>${q.number}. ${esc(q.prompt)}</h3>${questionBody(q)}</div>`; renderNav(); bindAnswers(); }
function questionBody(q) { const v=E.answers[q.id], opts=q.options||[];
  if(q.type==='mcq') return `<div class="option-list">${opts.map(o=>{const op=parseOption(o),val=op.letter||op.text;return `<label class="option"><input type="radio" name="q_${esc(q.id)}" value="${esc(val)}" ${answerText(v)===val?'checked':''} data-answer-input data-qid="${esc(q.id)}">${op.letter?`<span class="letter">${esc(op.letter)}</span>`:''}<span>${esc(op.text)}</span></label>`;}).join('')}</div>`;
  if(q.type==='multiple') { const sel=Array.isArray(v)?v:[]; const hint=q.maxAnswers?`<div class="word-limit">Choose ${q.maxAnswers} answers.</div>`:''; return hint+`<div class="option-list">${opts.map(o=>{const op=parseOption(o),val=op.letter||op.text;return `<label class="option"><input type="checkbox" name="q_${esc(q.id)}" value="${esc(val)}" ${sel.includes(val)?'checked':''} data-answer-input data-qid="${esc(q.id)}">${op.letter?`<span class="letter">${esc(op.letter)}</span>`:''}<span>${esc(op.text)}</span></label>`;}).join('')}</div>`; }
  if(q.type==='tfng'||q.type==='ynng') { const o=opts.length?opts:(q.type==='tfng'?['True','False','Not Given']:['Yes','No','Not Given']); return `<div class="three-options">${o.map(x=>`<label class="option"><input type="radio" name="q_${esc(q.id)}" value="${esc(x)}" ${answerText(v)===x?'checked':''} data-answer-input data-qid="${esc(q.id)}"><span>${esc(x)}</span></label>`).join('')}</div>`; }
  if(q.type==='matching') return `${q.context?`<div class="question-context">${esc(q.context)}</div>`:''}<select class="answer-input" data-answer-input data-qid="${esc(q.id)}"><option value="">Choose an answer</option>${opts.map(o=>`<option value="${esc(o)}" ${answerText(v)===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  const hint=q.wordLimit?`<div class="word-limit">Write NO MORE THAN ${q.wordLimit} WORD${q.wordLimit>1?'S':''}.</div>`:''; return `${q.context?`<div class="question-context">${esc(q.context)}</div>`:''}${hint}<input class="answer-input" type="text" value="${esc(answerText(v))}" placeholder="Type your answer" data-answer-input data-qid="${esc(q.id)}">`; }
function bindAnswers() { const h=document.getElementById('questionScroll'); h.onchange=e=>{ const i=e.target.closest('[data-answer-input]'); if(i) updateAnswer(i); }; h.oninput=e=>{ const i=e.target.closest('[data-answer-input]'); if(i&&!['radio','checkbox'].includes(i.type)&&i.tagName!=='SELECT') updateAnswer(i); }; }
function updateAnswer(input) { const id=input.dataset.qid, q=E.content.questions.find(x=>x.id===id); if(q?.type==='multiple') { E.answers[id]=[...document.querySelectorAll(`input[name="q_${CSS.escape(id)}"]:checked`)].map(x=>x.value); } else E.answers[id]=input.value; renderNav(); scheduleSave(); }
function scheduleSave() { clearTimeout(E.saveTimer); document.getElementById('autoSaveStatus').textContent='正在保存…'; E.saveTimer=setTimeout(async()=>{ try { await api('exam.save',{attemptId:E.attemptId,answers:E.answers}); document.getElementById('autoSaveStatus').textContent='已自动保存 '+new Date().toLocaleTimeString(); } catch(e){ document.getElementById('autoSaveStatus').textContent=e.message; if(e.message.includes('时间')) autoSubmit(); } },700); }
function isAnswered(id) { const v=E.answers[id]; return Array.isArray(v)?v.length>0:String(v??'').trim().length>0; }
function renderNav() { const qs=E.content.questions||[]; document.getElementById('questionNav').innerHTML=qs.map((q,i)=>`<button class="q-num ${isAnswered(q.id)?'answered':''} ${i===E.current?'current':''} ${E.flags[q.id]?'flagged':''}" data-goto="${i}">${q.number}</button>`).join(''); document.getElementById('questionNav').onclick=e=>{ const b=e.target.closest('[data-goto]'); if(b) goTo(Number(b.dataset.goto)); }; }
function goTo(i) { const n=E.content.questions?.length||0; if(i<0||i>=n) return; E.current=i; renderQuestion(); }
function toggleFlag() { const q=E.content.questions[E.current]; if(!q) return; E.flags[q.id]=!E.flags[q.id]; localStorage.setItem('ielts_flags_'+E.testId,JSON.stringify(E.flags)); renderNav(); document.getElementById('flagBtn').textContent=E.flags[q.id]?'Unflag':'Flag'; }
function openReview() { const qs=E.content.questions||[]; const m=showModal(`<h2>Review Answers</h2><p class="small muted">蓝色 = 已作答，橙色边框 = 已标记。</p><div class="review-grid">${qs.map((q,i)=>`<button class="review-item ${isAnswered(q.id)?'answered':''} ${E.flags[q.id]?'flagged':''}" data-jump="${i}"><strong>${q.number}</strong><div class="small muted">${isAnswered(q.id)?esc(answerText(E.answers[q.id])):'未作答'}</div></button>`).join('')}</div><div class="modal-actions"><button class="btn" id="closeReview">关闭</button><button class="btn primary" id="reviewSubmit">Submit</button></div>`); m.querySelector('#closeReview').onclick=hideModal; m.querySelector('#reviewSubmit').onclick=()=>{hideModal();confirmSubmit();}; m.querySelector('.review-grid').onclick=e=>{const b=e.target.closest('[data-jump]'); if(b){goTo(Number(b.dataset.jump));hideModal();}}; }
function tick() { if(!E.deadlineAt) return; const left=new Date(E.deadlineAt).getTime()-Date.now(); const el=document.getElementById('timer'); el.textContent=fmtTime(left); el.classList.toggle('danger',left<=5*60*1000); if(left<=0){clearInterval(E.timer);autoSubmit();} }
function confirmSubmit() { const a=(E.content.questions||[]).filter(q=>isAnswered(q.id)).length, n=E.content.questions?.length||0; const m=showModal(`<h2>确认提交</h2><p>已作答 <strong>${a}</strong> / ${n} 题。提交后不能修改。</p><div class="modal-actions"><button class="btn" id="cancelSub">取消</button><button class="btn primary" id="okSub">确认提交</button></div>`); m.querySelector('#cancelSub').onclick=hideModal; m.querySelector('#okSub').onclick=()=>{hideModal();submitExam(false);}; }
async function autoSubmit() { await submitExam(true); }
async function submitExam(auto) { try { clearTimeout(E.saveTimer); await api('exam.submit',{attemptId:E.attemptId,answers:E.answers}); E.submitted=true; clearInterval(E.timer); showSubmitted(auto); } catch(e){ alert(e.message); } }
function showSubmitted(auto) { document.getElementById('examLoginWrap').style.display='none'; document.getElementById('examShell').classList.remove('active'); const m=showModal(`<h2>答卷已提交</h2><p>${auto?'考试时间已到，系统已自动提交。':'你的答案已保存。'}老师批改并发布成绩后，可点击「查看已发布成绩」输入姓名查询结果。</p><div class="modal-actions"><button class="btn" id="subClose">关闭</button><button class="btn primary" id="subResult">查看成绩</button></div>`); m.querySelector('#subClose').onclick=hideModal; m.querySelector('#subResult').onclick=()=>{hideModal();openResultModal();}; }
function openResultModal() { const m=showModal(`<h2>查看已发布成绩</h2><label class="field"><span>学生姓名</span><input class="input" id="resultName" placeholder="请输入姓名"></label><div id="resultList"></div><div class="modal-actions"><button class="btn" id="closeResult">关闭</button><button class="btn primary" id="queryResult">查询</button></div>`); m.querySelector('#closeResult').onclick=hideModal; m.querySelector('#queryResult').onclick=queryResult; m.querySelector('#resultName').onkeydown=e=>{if(e.key==='Enter')queryResult();}; }
async function queryResult() { const name=document.getElementById('resultName').value.trim(); if(!name) return; try { const d=await api('exam.result',{name}); document.getElementById('resultList').innerHTML=d.results.map(r=>`<div class="panel" style="margin-bottom:10px"><h3>Volume ${r.volume} · Test ${r.test}</h3><div class="small muted">${fmtDate(r.submittedAt)}</div><p><strong>答对 ${r.score} / ${r.total} 题</strong> · <strong>雅思阅读分数：${Number(r.band).toFixed(1)}</strong></p>${(r.questions||[]).map(q=>`<div class="${q.correct?'right':'wrong'}" style="margin:6px 0"><strong>Q${q.number} ${q.correct?'✓ 正确':'✗ 错误'}</strong><div class="small">${esc(q.prompt)}</div><div class="small">你的答案：<span style="color:var(--blue);font-weight:700">${esc(answerText(q.studentAnswer)||'未作答')}</span></div><div class="small">正确答案：<span style="color:var(--green);font-weight:700">${esc(answerText(q.correctAnswer))}</span></div></div>`).join('')}</div>`).join('')||'<div class="notice">暂无已发布的成绩。</div>'; } catch(e){ document.getElementById('resultList').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'; } }

/* ========================= 单页启动 ========================= */
function route() {
  document.getElementById('view-grade').classList.add('active');
  document.querySelectorAll('.topnav a').forEach(a => a.classList.toggle('active', a.dataset.nav === 'grade'));
  gradeInit();
}
window.addEventListener('hashchange', route);
route();
</script>
