<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IELTS Reading Lab · 选择测试</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    .test-card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: #fff; }
    .test-card h3 { margin: 0 0 4px; color: var(--navy); }
    .link-box { font-family: Consolas, monospace; font-size: 12px; background: var(--soft); padding: 8px; border-radius: 6px; word-break: break-all; margin-top: 8px; }
    .timeline { border-left: 2px solid var(--blue); padding-left: 18px; }
    .timeline-item { position: relative; margin-bottom: 16px; }
    .timeline-item::before { content: ""; position: absolute; left: -25px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-mark">I</span> IELTS Reading Lab · 选择测试</div>
    <div class="header-actions"><a class="chip" href="/IELTS%20Reading%20Lab%20-%20Teacher.html">老师端</a><a class="chip" href="/IELTS%20Reading%20Lab%20-%20Grading.html">批改页</a></div>
  </header>

  <div class="container wide">
    <div class="panel">
      <div class="panel-title"><h2>1. 选择 Volume</h2><span class="muted small">共 21 册，每册 4 套测试</span></div>
      <div class="chip-row" id="volumes"></div>
    </div>

    <div class="panel">
      <div class="panel-title"><h2>2. 选择 Test</h2><span class="muted small" id="volumeTitle"></span></div>
      <div class="grid cols-4" id="tests"></div>
    </div>

    <div class="panel">
      <div class="panel-title"><h2>3. 学生成绩时间线</h2><span class="muted small">按提交时间从早到晚排列，可观察进步</span></div>
      <div class="grid cols-2" style="align-items:end">
        <label class="field" style="margin:0"><span>学生姓名</span><input class="input" id="studentName" placeholder="输入学生姓名，例如 Demo Student"></label>
        <div><button class="btn primary" id="queryHistory">查询成绩</button></div>
      </div>
      <div id="history" style="margin-top:18px"></div>
    </div>
  </div>
  <script type="module" src="/select-test.js"></script>
</body>
</html>
