<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IELTS Reading Lab · 批改与成绩</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    .grade-layout { display: grid; grid-template-columns: 300px 1fr; gap: 18px; }
    .attempt-item { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-bottom: 8px; background: #fff; cursor: pointer; }
    .attempt-item.active { border-color: var(--navy); background: #f2f7fa; }
    .answer-line { padding: 7px 10px; border-radius: 6px; margin: 5px 0; font-size: 14px; }
    .student-mark { background: #e8f4ff; border-left: 3px solid var(--blue); color: #0d4f80; }
    .correct-mark { background: #eaf7f0; border-left: 3px solid var(--green); color: #0f623f; }
    .option-mark { padding: 6px 10px; border-radius: 6px; margin: 4px 0; border: 1px solid var(--line); }
    .option-mark.student-mark { border-color: var(--blue); }
    .option-mark.correct-mark { border-color: var(--green); }
    .grade-q { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; background: #fff; }
    .grade-passage { border: 1px dashed var(--line); border-radius: 10px; padding: 18px; background: #fbfcfd; max-height: 480px; overflow: auto; }
    .grade-passage img { max-width: 100%; height: auto; }
    .decision { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-weight: 600; }
    .decision input { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-mark">I</span> IELTS Reading Lab · 批改与成绩</div>
    <div class="header-actions"><a class="chip" href="/IELTS%20Reading%20Lab%20-%20Teacher.html">老师端</a><a class="chip" href="/IELTS%20Reading%20Lab%20-%20Select%20Test.html">选测试卷</a></div>
  </header>

  <div class="container wide">
    <div class="grade-layout">
      <aside class="panel">
        <h2 style="font-size:18px">待批改 / 已提交</h2>
        <div id="attemptList" class="small muted">加载中…</div>
      </aside>
      <main>
        <div class="panel" id="summaryPanel"><div class="muted">请选择左侧答卷</div></div>
        <div class="panel" id="articlePanel" style="display:none">
          <h2>阅读文章</h2><div class="grade-passage" id="gradeArticle"></div>
        </div>
        <div class="panel" id="questionsPanel" style="display:none">
          <div class="panel-title"><h2>逐题比对</h2><div class="chip-row">
            <button class="btn sm" id="aiGradeBtn">AI 比对答案</button>
            <button class="btn sm green" id="saveGradeBtn">保存批改</button>
            <button class="btn sm accent" id="publishBtn">保存并发布成绩</button>
          </div></div>
          <div id="gradeQuestions"></div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="/grade.js"></script>
</body>
</html>
