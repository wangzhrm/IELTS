<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IELTS Reading · Online Test</title>
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/exam.css">
</head>
<body>
  <header class="exam-header">
    <div class="left">
      <span class="exam-logo">IELTS</span>
      <span class="exam-title" id="examTitle">Reading Test</span>
      <span class="muted small" id="examMeta"></span>
    </div>
    <div class="left">
      <span class="timer" id="timer">60:00</span>
      <button class="btn primary" id="submitBtn">Submit</button>
    </div>
  </header>

  <div class="exam-shell" id="examShell" style="display:none">
    <section class="passage-pane">
      <div class="passage-tabs" id="passageTabs"></div>
      <div class="passage-content" id="passageContent"></div>
    </section>
    <section class="question-pane">
      <div class="question-toolbar">
        <strong id="questionPosition">Question 1 of 1</strong>
        <div class="chip-row">
          <button class="btn sm" id="reviewBtn">Review</button>
          <button class="btn sm" id="flagBtn">Flag</button>
        </div>
      </div>
      <div class="question-scroll" id="questionScroll"></div>
      <div class="q-nav" id="questionNav"></div>
      <div class="exam-actions">
        <button class="btn" id="prevBtn">Previous</button>
        <span class="muted small" id="autoSaveStatus">答案会自动保存</span>
        <button class="btn primary" id="nextBtn">Next</button>
      </div>
    </section>
  </div>

  <div class="modal-backdrop show" id="loginModal">
    <div class="modal">
      <h2>IELTS Reading Test</h2>
      <div class="notice warn">点击 Start 后，考试倒计时为 <strong>60 分钟</strong>。时间结束时系统会自动提交。</div>
      <label class="field"><span>账号 Username</span><input class="input" id="username" autocomplete="username"></label>
      <label class="field"><span>密码 Password</span><input class="input" id="password" type="password" autocomplete="current-password"></label>
      <div id="loginError" class="notice error" style="display:none"></div>
      <div class="modal-actions">
        <button class="btn" id="resultBtn">查看已发布成绩</button>
        <button class="btn primary" id="startBtn">Start</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="submittedModal">
    <div class="modal">
      <h2>答卷已提交</h2>
      <p>你的答案已保存。老师批改并发布成绩后，可在本页面输入姓名查看结果。</p>
      <div class="modal-actions"><button class="btn primary" id="backToLoginBtn">返回</button></div>
    </div>
  </div>

  <div class="modal-backdrop" id="reviewModal"><div class="modal wide" id="reviewContent"></div></div>
  <div class="modal-backdrop" id="submitConfirm"><div class="modal">
    <h2>确认提交？</h2><p id="submitSummary"></p>
    <div class="modal-actions"><button class="btn" id="cancelSubmit">继续答题</button><button class="btn accent" id="confirmSubmit">确认提交</button></div>
  </div></div>
  <div class="modal-backdrop" id="resultModal"><div class="modal wide" id="resultContent"></div></div>

  <script type="module" src="/student.js"></script>
</body>
</html>
